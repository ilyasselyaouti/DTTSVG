speak:
  name: Speak
  description: Generate a text-to-speech waveform video and play it on the configured screen.
  fields:
    text:
      name: Text
      description: Text to synthesize and display on the screen.
      required: true
      example: "Bonjour, je suis prêt !"
      selector:
        text: null
    target:
      name: Target screen
      description: Override the configured screen (media_player entity).
      required: false
      selector:
        entity:
          domain: media_player
    priority:
      name: Priority
      description: If true, the announcement is played immediately (with ducking of the currently playing media when a backup screen exists). If false, it is queued until the speaker is free.
      required: false
      default: false
      selector:
        boolean: null